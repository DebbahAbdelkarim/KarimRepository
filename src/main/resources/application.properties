spring.application.name=WorkoutLoggingApp
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/workoutlogdatabase
spring.datasource.username=debbah
spring.datasource.password=0000
spring.jpa.hibernate.ddl-auto=drop-and-create
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable SQL statement logging
logging.level.org.hibernate.SQL=DEBUG

# Enable SQL parameter value binding tracing (Hibernate 6+)
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Optional: Format the SQL for readability
spring.jpa.properties.hibernate.format_sql=true